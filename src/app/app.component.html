<div class="min-h-screen bg-gray-100 p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <!-- Client Dropdown -->
    <div class="flex items-center">
      <label for="client" class="mr-2 text-lg font-semibold">Client:</label>
      <select id="client" class="border rounded p-2" [(ngModel)]="selectedClient" (ngModelChange)="selectClient($event)">
        @for (client of clients; track client._id) {
          <option [ngValue]="client">{{ client.name }}</option>
        }
      </select>
    </div>
    <!-- Current Date -->
    <div class="text-lg font-semibold">{{ currentDate }}</div>
  </div>

  <!-- Table -->
  <div class="bg-white shadow-md rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Produit</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">TTC</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quantité</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
      </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        @for (line of orderLines; track line._id) {
          <tr>
            <td class="px-6 py-4 whitespace-nowrap">{{ line.productLibelle }}</td>
            <td class="px-6 py-4 whitespace-nowrap">{{ calculateTTC(line.quantity, line.productPu) | number:'1.2-2' }}</td>
            <td class="px-6 py-4 whitespace-nowrap">{{ line.quantity }}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <button class="bg-green-500 text-white px-2 py-1 rounded mr-2" (click)="increaseQuantity(line)">+</button>
              <button class="bg-red-500 text-white px-2 py-1 rounded" (click)="decreaseQuantity(line)">-</button>
            </td>
          </tr>
        }
      </tbody>
      <tfoot>
      <tr>
        <td class="px-6 py-4 font-semibold" colspan="3">Total</td>
        <td class="px-6 py-4 font-semibold">{{ calculateTotal() | number:'1.2-2' }}</td>
      </tr>
      </tfoot>
    </table>
  </div>
</div>
